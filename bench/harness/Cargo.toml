[package]
name = "twigo-bench"
description = "The bench harness's tools: the churn generator, the process sampler and the report (ARCHITECTURE 3.8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fastrand.workspace = true
json-patch.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["jsonpatch"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
twigo-kube.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
mach2.workspace = true

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }
twigo-cache.workspace = true
twigo-ipc.workspace = true
