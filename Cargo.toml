[workspace]
resolver = "3"
members = [
    "apps/desktop/src-tauri",
    "bench/harness",
    "bench/ipc",
    "bench/ipc/brownfield",
    "bench/ipc/isolation",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/twigo/twigo"
publish = false

[workspace.dependencies]
twigo-bench-ipc = { path = "bench/ipc" }
twigo-cache = { path = "crates/twigo-cache" }
twigo-core = { path = "crates/twigo-core" }
twigo-describe = { path = "crates/twigo-describe" }
twigo-env = { path = "crates/twigo-env" }
twigo-ipc = { path = "crates/twigo-ipc" }
twigo-keyboard = { path = "crates/twigo-keyboard" }
twigo-kube = { path = "crates/twigo-kube" }
twigo-netmon = { path = "crates/twigo-netmon" }
twigo-policy = { path = "crates/twigo-policy" }
twigo-sessions = { path = "crates/twigo-sessions" }

aho-corasick = "1.1.5"
anstyle = "1.0.14"
anstyle-lossy = "1.1.5"
anstyle-parse = "1.0.0"
atomic-write-file = "0.3.1"
backon = { version = "1.6.0", default-features = false, features = ["std"] }
base64 = "0.23.1"
bytes = "1.12.1"
dhat = "0.3.3"
dispatch2 = "0.3.1"
fastrand = "2.5.0"
form_urlencoded = "1.2.2"
futures = "0.3.34"
gdkwayland-sys = "0.18.2"
gdkx11-sys = "0.18.2"
gtk = "0.18.2"
h2 = "0.4.20"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "rustls-platform-verifier", "tls12"] }
hyper-timeout = "0.5.2"
hyper-util = { version = "0.1.21", features = ["client-legacy", "client-proxy", "http1", "http2", "tokio"] }
indexset = "0.16.0"
ipnet = "2.12.2"
jiff = "0.2.38"
json-patch = "4.2.0"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = "5.0.0"
libc = "0.2.191"
mach2 = "0.7.0"
netlink-sys = { version = "0.9.0", features = ["tokio_socket"] }
nix = { version = "0.31.3", features = ["signal", "user"] }
notify-debouncer-full = "0.7.0"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFNotificationCenter", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["dispatch2", "libc", "pwr_mgt", "std"] }
objc2-system-configuration = { version = "0.3.2", default-features = false, features = ["SCDynamicStore", "SCDynamicStoreKey", "SCSchemaDefinitions", "dispatch2", "std"] }
percent-encoding = "2.3.2"
rcgen = "0.14.10"
regex = "1.13.1"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# kube 4.2's version, so the tree carries one YAML parser.
serde-saphyr = "0.0.29"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower = { version = "0.5.3", features = ["timeout", "util"] }
ts-rs = "12.0.1"
wayland-client = "0.31.15"
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-sys = { version = "0.31.11", features = ["client"] }
zbus = "5.19.0"
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"
x11rb = { version = "0.14.0", features = ["allow-unsafe-code", "xkb"] }
xkbcommon = { version = "0.9.0", default-features = false, features = ["wayland", "x11"] }
yaml-edit = "0.3.6"
