[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/twigo/twigo"
publish = false

[workspace.dependencies]
twigo-cache = { path = "crates/twigo-cache" }
twigo-core = { path = "crates/twigo-core" }
twigo-env = { path = "crates/twigo-env" }
twigo-ext-api = { path = "crates/twigo-ext-api" }
twigo-ext-host = { path = "crates/twigo-ext-host" }
twigo-helm = { path = "crates/twigo-helm" }
twigo-ipc = { path = "crates/twigo-ipc" }
twigo-kube = { path = "crates/twigo-kube" }
twigo-mcp = { path = "crates/twigo-mcp" }
twigo-policy = { path = "crates/twigo-policy" }
twigo-sessions = { path = "crates/twigo-sessions" }

dhat = "0.3.3"
form_urlencoded = "1.2.2"
futures = "0.3.34"
http = "1.5.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
jiff = "0.2.38"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = "4.2.0"
rustls = { version = "0.23.46", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
