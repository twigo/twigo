name: Rust

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**/*.md"
      - docs/**
      - .claude/**
  pull_request:
    paths-ignore: *docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxkbcommon-x11-dev \
            x11-xkb-utils \
            xvfb \
            sway \
            wtype \
            zsh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Follow the keyboard layout on a live X server
        run: xvfb-run -a sh -c 'TWIGO_TEST_X11_DISPLAY=$DISPLAY cargo test -p twigo-keyboard --test x11 -- --ignored'
      - name: Follow the keyboard layout on a live Wayland compositor
        run: crates/twigo-keyboard/linux/wayland.sh cargo test -p twigo-keyboard --test wayland -- --ignored
      - name: Follow wake and network changes
        # The netlink test adds a dummy link, as root in a network of its own.
        run: |
          cargo test -p twigo-netmon -- --ignored a_resume_from_sleep_is_a_wake
          test=$(cargo test -p twigo-netmon --lib --no-run --message-format=json | jq -r 'select(.profile.test and .executable != null) | .executable')
          sudo unshare --net "$test" --ignored an_address_added_is_a_network_change
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --debug --no-bundle
