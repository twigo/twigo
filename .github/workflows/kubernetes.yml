name: Kubernetes

on:
  pull_request:
    paths: &paths
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/twigo-cache/**
      - crates/twigo-core/**
      - crates/twigo-kube/**
      - crates/twigo-policy/**
      - crates/twigo-sessions/**
      - bench/harness/**
      - bench/cluster.sh
      - bench/pods.sh
      - .github/workflows/kubernetes.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kubernetes
      - run: cargo test -p twigo-cache -p twigo-kube -p twigo-core -p twigo-bench -p twigo-sessions --no-run

  live:
    if: github.event_name != 'push'
    name: Live tests on ${{ matrix.kubernetes }}
    strategy:
      fail-fast: false
      matrix:
        kubernetes: ["1.33", "1.34", "1.35", "1.36", "1.37"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind
      - name: Install zsh, which the terminal's live tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: kubernetes
          save-if: false
      - run: cargo test -p twigo-cache -p twigo-kube -p twigo-core -p twigo-bench -p twigo-sessions --no-run
      - name: Start a kind cluster with kwok
        env:
          TWIGO_BENCH_DIR: ${{ runner.temp }}/bench
        run: |
          kubeconfig=$(bench/cluster.sh up ci ${{ matrix.kubernetes }} | tail -1)
          echo "TWIGO_TEST_KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
      # The tests that give a pid to another process group write ns_last_pid, which needs
      # privileges; linux.sh runs them.
      - run: cargo test -p twigo-cache -p twigo-kube -p twigo-core -p twigo-bench -p twigo-sessions -- --ignored --skip a_terminal_closed_after_its_shell_ended_spares_whoever_has_its_pid_now --skip a_group_that_takes_the_foreground_job_s_id_within_the_grace_is_spared
