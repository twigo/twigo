name: Bug report
description: Report something that isn't working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what's wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: What you did, and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Twigo fills this in when you choose Open Issue on GitHub in Help > Report a Problem…, or you can copy it from that dialog.
      placeholder: |
        Twigo: 0.1.0 (3f2a9c1)
        System: Mac OS 27.2.1 (aarch64)
        Engine: WebKit 22625.2.8.11.9
        Kubernetes: v1.37.2
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste what Twigo copied when you chose Open Issue on GitHub, or Copy in Help > Report a Problem….
        Twigo hid the names, paths and tokens it knows of; read it before you submit, since an issue is public.
      render: text
  - type: upload
    id: report
    attributes:
      label: Saved report
      description: The file that Save… in Help > Report a Problem… wrote, if you saved one.
    validations:
      accept: ".txt,.log"
