[package]
name = "twigo-core"
description = "App services: spaces, settings layers, catalog, command bus, the policy proxy and its approval broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `Core::set_terminal_program` and `set_terminal_zdotdir`, for the tests that run a shell of
# their own.
test-util = []

[dependencies]
atomic-write-file.workspace = true
base64.workspace = true
bytes.workspace = true
fastrand.workspace = true
form_urlencoded.workspace = true
futures.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util.workspace = true
jiff = { workspace = true, features = ["serde"] }
k8s-openapi.workspace = true
kube.workspace = true
notify-debouncer-full.workspace = true
percent-encoding.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls.workspace = true
tokio-util.workspace = true
twigo-cache.workspace = true
twigo-describe.workspace = true
twigo-env.workspace = true
twigo-ipc.workspace = true
twigo-kube.workspace = true
twigo-netmon.workspace = true
twigo-policy.workspace = true
twigo-sessions.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1", "server"] }
twigo-core = { workspace = true, features = ["test-util"] }
twigo-cache = { workspace = true, features = ["test-util"] }
twigo-kube = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
