[package]
name = "twigo-netmon"
description = "Wake from sleep and network changes, read from the OS for the transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2.workspace = true
objc2-core-foundation.workspace = true
objc2-io-kit.workspace = true
objc2-system-configuration.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures.workspace = true
libc.workspace = true
netlink-sys.workspace = true
zbus.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
