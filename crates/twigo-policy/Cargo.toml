[package]
name = "twigo-policy"
description = "Read-only modes, authorization, what an approval covers, audit log, redaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `Policy::set_mode`, `set_environment`, `unlock` and `unlock_for`, which change a context's
# protection unplanned and unrecorded, for tests.
test-util = []

[lints]
workspace = true

[dependencies]
base64.workspace = true
form_urlencoded.workspace = true
glob.workspace = true
http.workspace = true
jiff = { workspace = true, features = ["serde"] }
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tower.workspace = true
tracing.workspace = true
twigo-ipc.workspace = true
twigo-log.workspace = true

[dev-dependencies]
tempfile.workspace = true
twigo-policy = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
