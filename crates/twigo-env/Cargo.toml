[package]
name = "twigo-env"
description = "Login-shell environment resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fastrand.workspace = true
nix = { workspace = true, features = ["process"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "sync", "time"] }
twigo-ipc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFLocale"] }

[dev-dependencies]
libc.workspace = true
nix = { workspace = true, features = ["process", "term"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "test-util"] }

[[test]]
name = "live"
harness = false
