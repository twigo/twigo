[package]
name = "twigo-cache"
description = "Watch hub: upstream watches, row stores, query views, batching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The fake API server of the hub's tests, for the tests of the crates over it.
test-util = ["dep:bytes", "dep:http-body", "dep:tower", "twigo-kube/test-util"]

[dependencies]
backon.workspace = true
bytes = { workspace = true, optional = true }
flate2.workspace = true
form_urlencoded.workspace = true
futures.workspace = true
http.workspace = true
http-body = { workspace = true, optional = true }
http-body-util.workspace = true
indexset.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tower = { workspace = true, optional = true }
twigo-ipc.workspace = true
twigo-kube.workspace = true
twigo-quantity.workspace = true

[dev-dependencies]
bytes.workspace = true
dhat.workspace = true
fastrand.workspace = true
http-body.workspace = true
kube = { workspace = true, features = ["runtime"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
twigo-kube = { workspace = true, features = ["test-util"] }
