apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  host: {{ .Values.database.host | quote }}
  password: {{ .Values.database.password | quote }}
data:
  token: {{ printf "token-for-%s" .Release.Name | b64enc | quote }}
