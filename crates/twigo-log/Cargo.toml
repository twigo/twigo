[package]
name = "twigo-log"
description = "The rotating file of the audit and diagnostics logs, the diagnostics log's subscriber, the panic hook and the facts of a run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `capture`, which keeps a test thread's events as lines.
test-util = []

[lints]
workspace = true

[dependencies]
os_info.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
twigo-ipc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# kube-client turns it on in the app: an event then also becomes a `log` record while no subscriber is set.
tracing = { workspace = true, features = ["log"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
